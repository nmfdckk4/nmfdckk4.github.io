<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiny的物理網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --btn-gradient: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: env(safe-area-inset-top) 20px 40px; /* 適配手機安全區域 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-top: 30px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.8rem;
            color: #4834d4;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #636e72;
            margin-bottom: 30px;
        }

        /* 關鍵：使用 Grid 佈局 */
        .link-container {
            display: grid;
            grid-template-columns: 1fr; /* 手機預設一欄 */
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        /* 當螢幕寬度超過 500px 時轉為雙欄 */
        @media (min-width: 500px) {
            .link-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .physics-card {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            text-decoration: none;
            color: white;
            background: var(--btn-gradient);
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 80px;
            line-height: 1.4;
        }

        /* 點擊效果：手機上很有感 */
        .physics-card:active {
            transform: scale(0.96);
        }

        footer {
            margin-top: auto;
            padding-top: 50px;
            width: 100%;
            text-align: center;
            opacity: 0.8;
        }

        .counter-box {
            background: white;
            padding: 10px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>高中物理動畫教材</h1>
        <p class="subtitle">點擊下方主題開始探索物理原理</p>
    </header>

    <div id="links" class="link-container"></div>

    <a href='http://www.freevisitorcounters.com'>more information</a> <script type='text/javascript' src='https://www.freevisitorcounters.com/auth.php?id=0bdda906befb5100d395394827ef1d1e34e7b433'></script>
    <script type="text/javascript" src="https://www.freevisitorcounters.com/en/home/counter/1459286/t/3"></script>

    <script>
        // --- 設定區：未來要新增動畫，只要在下面這個括號 [] 內增加一組資料即可 ---
        const animations = [
            { title: "波的兩種面向<br>(團照 / 連拍)", url: "wave_aspects.html" },
            { title: "向心力<br>(碰撞多邊形)", url: "centripetal.html" },
            { title: "簡諧運動與<br>圓周運動投影", url: "shm.html" },
            { title: "單擺與 SHM<br>週期比較", url: "pendulum_vs_shm.html" },
            { title: "從完全非彈碰感受動量守恆<br>及質心座標系之好處", url: "collision.html" }
            // { title: "新動畫名稱", url: "new_animation.html" }, 
        ];

        const container = document.getElementById('links');

        // 自動生成 HTML 結構
        animations.forEach(item => {
            const link = document.createElement('a');
            link.href = item.url;
            link.className = 'physics-card';
            link.innerHTML = item.title;
            container.appendChild(link);
        });
    </script>
</body>
</html>
